<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>카카오맵 테스트</title>
</head>
<body>
    <div id="map" style="width:100%; height:500px; background-color: #f0f0f0;"></div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=e649a3c2a537067ced1357bb6737de11"></script>
    <script>
        var container = document.getElementById('map');
        var options = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567),
            level: 3
        };

        // 지도를 생성
        try {
            var map = new kakao.maps.Map(container, options);
            console.log("성공!");
        } catch (e) {
            console.error("지도 생성 중 에러 발생:", e);
        }
    </script>
</body>
</html>
