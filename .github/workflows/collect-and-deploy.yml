name: 데이터 수집 & GitHub Pages 배포

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 카카오맵 키 주입
        run: |
          sed -i "s/KAKAO_APP_KEY_PLACEHOLDER/${{ secrets.KAKAO_APP_KEY }}/g" FM/docs/index.html

      - name: Gradle 빌드
        working-directory: FM
        run: |
          chmod +x ./gradlew
          ./gradlew shadowJar --no-daemon

      - name: 데이터 수집 (CollectorMain)
        working-directory: FM
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_ERR: ${{ secrets.DISCORD_WEBHOOK_URL_ERR }}
        run: java -jar build/libs/crawler.jar

      - name: 변경사항 확인
        id: diff
        run: |
          git diff --quiet FM/docs/data/regions.json \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true"  >> $GITHUB_OUTPUT

      - name: regions.json 커밋 & 푸시
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add FM/docs/data/regions.json
          git commit -m "chore: 데이터 자동 업데이트 $(date +'%Y-%m-%d')"
          git push

      - name: Discord 알림 - 업데이트됨
        if: steps.diff.outputs.changed == 'true'
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"✅ regions.json 업데이트 완료 ($(date +'%Y-%m-%d'))\"}"

      - name: Discord 알림 - 변경 없음
        if: steps.diff.outputs.changed == 'false'
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"ℹ️ regions.json 변경 없음 ($(date +'%Y-%m-%d'))\"}"

      - name: GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./FM/docs
          publish_branch: gh-pages
